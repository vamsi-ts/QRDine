spring.application.name=restaurant-qr-ordering-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-change-this-local-development-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}